<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tareas</title>
    <link href="https://fonts.googleapis.com/css2?family=Dosis&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
    <style>
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input, textarea {
            width: 100%;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: var(--border-radius);
        }
    </style>
</head>
<body>
    <main>
    <div class="container">
        <header>
            <h1>Gestión de Tareas</h1>
            <a href="index.html" class="btn btn-get">Volver</a>
        </header>

        <div class="results">
            <h3>Nueva Tarea</h3>
            <div data-status></div>
            
            <form data-form>
                <input type="hidden" data-tarea-id>
                <div class="form-group">
                    <label for="tarea">Tarea:</label>
                    <input type="text" data-tarea required>
                </div>
                
                <div class="form-group">
                    <label for="fecha">Fecha:</label>
                    <input type="date" data-fecha required>
                </div>
                
                <div class="form-group">
                    <label for="descripcion">Descripción:</label>
                    <textarea data-descripcion rows="3" required></textarea>
                </div>
                
                <div class="form-group">
                    <label for="nombre">Nombre:</label>
                    <input type="text" data-nombre required>
                </div>
                
                <div class="form-group">
                    <label for="valor">Valor:</label>
                    <input type="number" data-valor required>
                </div>
                
                <button type="button" class="btn btn-post" data-submit>Agregar</button>
            </form>
        </div>
        
        <div class="results" style="margin-top: 20px;">
            <h3>Lista de Tareas</h3>
            <table data-tabla-tareas>
                <thead>
                    <tr>
                        <th>Tarea</th>
                        <th>Fecha</th>
                        <th>Descripción</th>
                        <th>Nombre</th>
                        <th>Valor</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody data-lista-tareas>
                    <tr>
                        <td colspan="6" style="text-align: center;">Cargando...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script src="js/tarea.js"></script>
    </main>
</body>
</html>
