<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CinePan - Funciones</title>
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
    <nav>
        <ul>
            <li><a href="./index.html">Inicio</a></li>
            <li><a href="./peliculas.html">Películas</a></li>
            <li><a href="./funciones.html" class="active">Funciones</a></li>
            <li><a href="./clientes.html">Clientes</a></li>
            <li><a href="./boletos.html">Boletos</a></li>
        </ul>
    </nav>
    
    <div class="container">
        <h1>Gestión de Funciones</h1>
        
        <div class="form-container mb-2">
            <h2 class="form-title">Agregar/Editar Función</h2>
            <form data-form>
                <input type="hidden" data-id>
                
                <div class="form-group">
                    <label for="pelicula">Película:</label>
                    <select id="pelicula" data-pelicula required>
                        <option value="">Seleccione una película</option>
                        <!-- -->
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="sala">Sala:</label>
                    <input type="text" id="sala" data-sala required placeholder="Ej: Sala 1">
                </div>
                
                <div class="form-group">
                    <label for="fecha">Fecha:</label>
                    <input type="date" id="fecha" data-fecha required>
                </div>
                
                <div class="form-group">
                    <label for="hora">Hora:</label>
                    <input type="time" id="hora" data-hora required>
                </div>
                
                <div class="form-group">
                    <label for="precio">Precio:</label>
                    <input type="number" id="precio" data-precio step="0.01" min="0" required placeholder="Ej: 10.50">
                </div>
                
                <div>
                    <button type="submit" class="btn btn--primary">Guardar</button>
                    <button type="button" class="btn btn--secondary" data-limpiar>Limpiar</button>
                </div>
            </form>
        </div>
        
        <div data-alert></div>
        
        <h2>Listado de Funciones</h2>
        <table class="data-table">
            <thead>
                <tr>
                    <th>Película</th>
                    <th>Sala</th>
                    <th>Fecha</th>
                    <th>Hora</th>
                    <th>Precio</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody data-table></tbody>
        </table>
    </div>
    
    <footer>
        <p>&copy; 2025 CinePan - Sistema de Administracion de Cines</p>
    </footer>
    
    <script type="module" src="../controllers/funcion-controller.js"></script>
</body>
</html>
