<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CinePan - Clientes</title>
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
    <nav>
        <ul>
            <li><a href="./index.html">Inicio</a></li>
            <li><a href="./peliculas.html">Películas</a></li>
            <li><a href="./funciones.html">Funciones</a></li>
            <li><a href="./clientes.html" class="active">Clientes</a></li>
            <li><a href="./boletos.html">Boletos</a></li>
        </ul>
    </nav>
    
    <div class="container">
        <h1>Gestión de Clientes</h1>
        
        <div class="form-container mb-2">
            <h2 class="form-title">Agregar/Editar Cliente</h2>
            <form data-form>
                <input type="hidden" data-id>
                
                <div class="form-group">
                    <label for="nombre">Nombre:</label>
                    <input type="text" id="nombre" data-nombre required placeholder="Ej: Gato Waton">
                </div>
                
                <div class="form-group">
                    <label for="email">Email:</label>
                    <input type="email" id="email" data-email required placeholder="Ej: waton@gmail.com">
                </div>
                
                <div class="form-group">
                    <label for="telefono">Teléfono:</label>
                    <input type="tel" id="telefono" data-telefono placeholder="Ej: 110">
                </div>
                
                <div>
                    <button type="submit" class="btn btn--primary">Guardar</button>
                    <button type="button" class="btn btn--secondary" data-limpiar>Limpiar</button>
                </div>
            </form>
        </div>
        
        <div data-alert></div>
        
        <h2>Listado de Clientes</h2>
        <table class="data-table">
            <thead>
                <tr>
                    <th>Nombre</th>
                    <th>Email</th>
                    <th>Teléfono</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody data-table></tbody>
        </table>
    </div>
    
    <footer>
         <p>&copy; 2025 CinePan - Sistema de Administracion de Cines</p>
    </footer>
    
    <script type="module" src="../controllers/cliente-controller.js"></script>
</body>
</html>
